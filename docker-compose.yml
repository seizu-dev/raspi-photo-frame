services:
  app:
    # GHCR から pull するのが正規経路。build: . は GHCR に無いタグ・手元の修正を
    # 試すときのフォールバック
    build: .
    image: ghcr.io/seizu-dev/raspi-photo-frame:${PF_IMAGE_TAG:-latest}
    container_name: pi-photo-frame
    restart: unless-stopped
    init: true

    user: "1000:1000"

    # GID はホスト固有。ずれていたら .env で上書きする
    # 確認コマンド: getent group video render input gpio
    group_add:
      - "${GID_VIDEO:-44}"   # video  -> /dev/dri/card0（描画）
      - "${GID_RENDER:-992}" # render -> /dev/dri/renderD128（描画）
      - "${GID_INPUT:-996}"  # input  -> /dev/input/*（タッチ）
      - "${GID_GPIO:-986}"   # gpio   -> /dev/gpiochip0（人感センサー）

    # --privileged は使わず必要最小限のデバイスだけ渡す
    devices:
      - /dev/dri:/dev/dri         # KMSDRM 描画
      - /dev/input:/dev/input     # USB タッチ入力
      - /dev/gpiochip0:/dev/gpiochip0  # 人感センサー。無ければこの行を外す

    volumes:
      - /run/udev:/run/udev:ro         # 無いと SDL2 がタッチデバイスを列挙できない
      - ./config:/config               # settings.json 等の秘匿情報をイメージに焼かない
      - photo-cache:/cache             # named volume。再作成のたびに再ダウンロードしないため
      - /etc/localtime:/etc/localtime:ro  # tzdata を別途入れずローカル時刻にする
      # ローカルフォルダ取得元（PF_PHOTO_PROVIDER=local）の写真置き場。アプリは読むだけなので
      # 読み取り専用。Immich 利用時は空ディレクトリが作られるだけで無害。ホスト側に無い
      # パスは Docker が root 所有で作るので、使うなら先に自分の権限で作っておく
      - ${PF_LOCAL_PHOTO_DIR:-./photos}:/photos:ro

    environment:
      SDL_VIDEODRIVER: kmsdrm
      SDL_RENDER_DRIVER: opengles2  # 必須。既定の opengl では描画が黙って無視される
      PYTHONUNBUFFERED: "1"
      PF_CONFIG_DIR: /config
      PF_CACHE_DIR: /cache

    env_file:
      - .env  # IMMICH_BASE_URL / IMMICH_API_KEY 等。.env.sample からコピーして使う

    logging:
      driver: json-file
      options:
        max-size: "10m"  # SD カードでログが無制限に増えないように
        max-file: "3"

    # mem_limit は書かない。実機は cgroup_disable=memory で起動しており効かない

volumes:
  photo-cache:
