# Linux デスクトップ（X11 セッション）の画面へコンテナから直接表示する構成。
# VNC を経由しないため描画がカクつかない。本番用の docker-compose.yml とは独立した
# ファイルで、こちらを変更しても本番構成には影響しない。
#
#   docker compose -f docker-compose.desktop.yml up --build
#
# runtime ステージは KMSDRM / GLES2 用で x86 の OpenGL ドライバ（libgl1-mesa-dri）を
# 持たないため、dev ステージを使う。ソースは COPY せず bind mount する。
# X への接続はホストの xhost（SI:localuser:<uid 1000 のユーザー>）で許可される前提。
# 拒否される場合はホストで `xhost +SI:localuser:$(id -un)` を実行する。
# docker-compose.yml と同じプロジェクト名・サービス名だと本番構成のコンテナを
# 置き換えてしまうため、プロジェクト名を分ける
name: raspi-photo-frame-desktop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    # build: . の docker-compose.yml と違い GHCR の名前で上書きタグ付けしないよう別名にする
    image: raspi-photo-frame:desktop
    init: true
    user: "1000:1000"
    group_add:
      - "${GID_VIDEO:-44}"   # video  -> /dev/dri/card*
      - "${GID_RENDER:-992}" # render -> /dev/dri/renderD128（GPU による OpenGL）
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - .:/workspaces/pi-photo-frame
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      DISPLAY: ${DISPLAY:-:0}
      # dev ステージの ENV と同じ値。IS_DEV_ENVIRONMENT=true で DRM DPMS と GPIO を使わず、
      # 消灯時は黒い復帰待ちウィンドウになる（クリックで復帰）
      SDL_VIDEODRIVER: x11
      SDL_RENDER_DRIVER: opengl
      SDL_VIDEO_X11_XRANDR: "0"
      IS_DEV_ENVIRONMENT: "true"
      PYTHONUNBUFFERED: "1"
      # PF_CONFIG_DIR / PF_CACHE_DIR は設定しない。Dev Container と同じく
      # ワークスペースの ./config / ./cache を使う
    env_file:
      - .env
    command: ["python", "main.py"]
